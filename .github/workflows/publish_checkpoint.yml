name: publish-checkpoint

# Actions artifacts (actions/upload-artifact) are only downloadable
# through GitHub's own UI/API/CLI -- the underlying blob storage isn't
# reachable from arbitrary tooling. This workflow re-publishes a given
# run's artifact as a committed file on a dedicated branch instead, so
# it's fetchable with plain `git fetch` like any other repo content.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to pull the artifact from"
        required: true
      artifact_name:
        description: "Artifact name to pull (e.g. e002-checkpoint, banglish-checkpoint)"
        default: "e002-checkpoint"
      branch:
        description: "Branch to publish the checkpoint to (created if missing)"
        default: "checkpoints/e002-latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: published-checkpoint
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit checkpoint to the publish branch
        run: |
          git config user.name "tiny-ai-copilot"
          git config user.email "tiny-ai-copilot@users.noreply.github.com"
          git checkout -B "${{ inputs.branch }}"
          git add -f published-checkpoint
          git commit -m "Publish ${{ inputs.artifact_name }} from run ${{ inputs.run_id }}"
          git push -f origin "HEAD:${{ inputs.branch }}"
