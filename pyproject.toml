[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ai"
version = "0.1.0"
description = "Experiments in genuinely tiny generative language models."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2"
]

[tool.setuptools.packages.find]
include = ["tiny_ai*"]
