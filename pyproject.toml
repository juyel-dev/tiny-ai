[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ai"
version = "0.1.0"
description = "Experiments in genuinely tiny generative language models."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["huggingface_hub>=0.34.0", "datasets>=2.20.0", "pandas>=2.0.0"]

[tool.setuptools.packages.find]
include = ["tiny_ai*"]
